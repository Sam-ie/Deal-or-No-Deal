  body{display:flex;height:100vh;margin:0;overflow:hidden}
  #root{flex:1 1 56%;min-width:0;overflow:auto}
  .strategy-pane{flex:0 0 600px;max-width:46%;min-width:340px;height:100vh;overflow:auto;
    background:#0b0c11;color:#f1ede4;box-sizing:border-box;display:flex;gap:14px;align-items:stretch;
    padding:14px;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    border-left:1px solid rgba(150,120,90,.22)}
  .sp-col{background:#14151d;border:1px solid rgba(150,120,90,.22);border-radius:12px;padding:14px 16px;box-sizing:border-box;flex:1 1 auto;width:100%;min-width:0}
  .sp-strat{display:flex;flex-direction:column}
  .sp-title{font-size:15px;font-weight:600;margin:0 0 8px;color:#f1ede4}
  .sp-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(150,120,90,.14)}
  .sp-row span{color:#9b9490}
  .sp-row b{font-weight:600;color:#f1ede4;font-variant-numeric:tabular-nums}
  .sp-verdict{margin:12px 0 10px;text-align:center;border-radius:8px;padding:9px;font-size:14px;font-weight:700}
  .sp-verdict.deal{background:rgba(67,185,127,.16);color:#43b97f;border:1px solid rgba(67,185,127,.4)}
  .sp-verdict.nodeal{background:rgba(217,84,74,.16);color:#d9544a;border:1px solid rgba(217,84,74,.4)}
  .sp-gamma{display:flex;flex-direction:column;gap:4px;margin-top:18px}
  .sp-gamma-label{font-size:12px;color:#9b9490}
  .sp-gamma-label b{color:#e6c178}
  .sp-gamma input[type=range]{width:100%;accent-color:#e6c178}
  .sp-note{font-size:11px;color:#8c8a93;line-height:1.6;margin-top:10px}
  .sp-offer-big{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:2px 0 4px}
  .sp-offer-big span{color:#9b9490}
  .sp-offer-big b{font-size:22px;font-weight:700;color:#e6c178;font-variant-numeric:tabular-nums}
  .sp-banker{margin-top:12px;border-top:1px solid rgba(150,120,90,.18);padding-top:10px}
  .sp-banker-title{font-size:13px;font-weight:600;color:#e6c178;margin-bottom:6px}
  .sp-row2{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
  .sp-row2 span{color:#9b9490}
  .sp-row2 b{font-weight:600;color:#f1ede4;font-variant-numeric:tabular-nums}
  .sp-coefbar{margin:8px 0 4px}
  .sp-track{position:relative;height:14px;background:rgba(255,255,255,.06);border-radius:7px;overflow:hidden}
  .sp-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e6c178,#d98f3c);border-radius:7px}
  .sp-tick{position:absolute;top:-3px;bottom:-3px;width:2px}
  .sp-tick.std{background:#5b9bd5}
  .sp-tick.model{background:#9aa0a6}
  .sp-coefleg{display:flex;gap:10px;margin-top:5px;font-size:10.5px;color:#b8ad97}
  .sp-coefleg .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
  .sp-coefleg .dot.std{background:#5b9bd5}
  .sp-coefleg .dot.model{background:#9aa0a6}
  .sp-coefleg .dot.act{background:#e6c178}
  .sp-parse{font-size:11.5px;color:#cfc9bf;margin-top:8px;font-variant-numeric:tabular-nums}
  .sp-parse2{font-size:10.5px;color:#9b9490;margin-top:3px;line-height:1.5}
  .sp-thresh{margin-top:18px;border-top:1px solid rgba(150,120,90,.18);padding-top:10px;margin-bottom:6px}
  .sp-thresh-title{font-size:13px;font-weight:600;color:#e6c178;margin-bottom:6px}
  .sp-track2{position:relative;height:26px;background:rgba(255,255,255,.06);border-radius:6px;margin-bottom:4px}
  .sp-zone{position:absolute;top:0;bottom:0;right:0;background:rgba(67,185,127,.14);border-left:1px dashed rgba(67,185,127,.5)}
  .sp-mark{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #9b9490}
  .sp-mark span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9.5px;white-space:nowrap;color:#b8ad97}
  .sp-mark.ev{border-color:#7f8a99}
  .sp-mark.ce{border-color:#5b9bd5}
  .sp-mark.offer{border-color:#e6c178}
  .sp-mark.offer.hit{border-color:#43b97f}
  .sp-mark.offer.hit span{color:#43b97f;font-weight:700}
  .sp-gaugesub{font-size:10.5px;color:#9b9490;font-variant-numeric:tabular-nums}
  .sp-details{margin-top:12px;border-top:1px solid rgba(150,120,90,.18);padding-top:8px}
  .sp-details>summary{cursor:pointer;font-size:13px;font-weight:600;color:#e6c178;user-select:none}
  .sp-details>summary:hover{color:#f1d99a}
  .sp-detail-body{margin-top:10px;font-size:12px;color:#b9b4ab;line-height:1.7}
  .sp-detail-body h4{font-size:12px;color:#cdbfa6;margin:12px 0 4px;font-weight:600}
  .sp-detail-body p{margin:2px 0}
  .sp-formula{background:#0e0f15;border:1px solid rgba(150,120,90,.18);border-radius:6px;padding:6px 8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#e6c178;margin:4px 0;white-space:normal;word-break:break-word}
  .sp-live{background:rgba(230,193,120,.08);border:1px solid rgba(230,193,120,.2);border-radius:6px;padding:7px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:#f1ede4;white-space:pre-line;margin-top:4px;line-height:1.6}
  .sp-stateline{font-size:12px;color:#9b9490;margin-bottom:4px}
  .sp-gloss{margin:6px 0 0;display:grid;gap:4px}
  .sp-gloss>div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
  .sp-gloss dt{color:#9b9490;white-space:nowrap;font-weight:600}
  .sp-gloss dd{margin:0;color:#cfc9bf}
  @media (max-width:1000px){

      '<div class="sp-mark offer '+(offer>=ce?'hit':'')+'" style="left:'+offP.toFixed(1)+'%"><span>'+fmt(offer)+'</span></div></div>'+
      '<div class="sp-gaugesub">'+T('l_gaugesub').split('{ev}').join(fmt(bd.ev)).split('{ce}').join(fmt(ce)).split('{o}').join(fmt(offer))+'</div>';
  }
  // 效用：CRRA。γ=0 风险中性(线性)、γ=1 对数、γ>1 更厌恶
  function utility(x,gamma){ if(!(x>0)) x=0.01; if(Math.abs(gamma-1)<1e-9) return Math.log(x); return (Math.pow(x,1-gamma)-1)/(1-gamma); }
  function invUtil(u,gamma){ if(Math.abs(gamma-1)<1e-9) return Math.exp(u); return Math.pow((1-gamma)*u+1,1/(1-gamma)); }

  // 续值 Bellman：V(S)=max(u(B(S)),(1/|S|)Σ_j V(S{j}))。|S|<=12 精确价值迭代（O(2^|S|)，<=12 安全）；
  // |S|>12 用蒙特卡洛序贯 rollout（随机采样下一步、避免 2^|S| 爆炸），完整展开后续开箱与银行家报价曲线，
  // 不再退化为 EV（风险中性=朴素比期望，会丢掉风险厌恶带来的折扣）。
  var EXACT_CAP=12, memo={}, mcCache={}, offerLog=[], lastOfferKey='', lastLoggedRound=99;
  function evOf(s){ return s.reduce(function(a,b){return a+b;},0)/s.length; }
  function V(s,gamma){
    if(s.length>EXACT_CAP) return mcV(s,gamma);
    var key=s.slice().sort(function(a,b){return a-b;}).join(',')+'|'+gamma.toFixed(3);
    if(memo[key]!==undefined) return memo[key];
    var val;
    if(s.length===1){ val=utility(s[0],gamma); }
    else {
      var i=roundIndex(s.length), dealU=utility(bankerOffer(s,i),gamma), sum=0, j;
      for(j=0;j<s.length;j++){ var s2=s.slice(0,j).concat(s.slice(j+1)); sum+=V(s2,gamma); }
      val=Math.max(dealU, sum/s.length);
    }
    memo[key]=val; return val;
  }
  function QNoDeal(s,gamma){
    if(s.length>EXACT_CAP){
      var K=(s.length>10)?10:s.length, total=0, j;
      for(j=0;j<K;j++){ var k=Math.floor(Math.random()*s.length); var s2=s.slice(0,k).concat(s.slice(k+1)); total+=mcV(s2,gamma); }
      return total/K;
    }
    if(s.length===1) return utility(s[0],gamma);
    var sum=0,j; for(j=0;j<s.length;j++){ var s2=s.slice(0,j).concat(s.slice(j+1)); sum+=V(s2,gamma); } return sum/s.length;
  }
  // 蒙特卡洛序贯续值：mcValue 沿一条随机路径展开（每节点只采样【一个】下一步，branching=1），
  // 每步取 max(成交效用, 续值)；顶层 mcV 用 M 条独立 rollout 平均降方差。复杂度 O(M·depth)，绝不爆炸。
  function mcValue(S,gamma,depth){
    if(S.length<=1) return utility(S[0],gamma);
    if(depth<=0) return utility(evOf(S),gamma);
    var i=roundIndex(S.length), b=bankerOffer(S,i), dealU=utility(b,gamma);
    var k=Math.floor(Math.random()*S.length);
    var S2=S.slice(0,k).concat(S.slice(k+1));
    return Math.max(dealU, mcValue(S2,gamma,depth-1));
  }
  function mcV(S,gamma){
    var key=S.slice().sort(function(a,b){return a-b;}).join(',')+'|'+gamma.toFixed(3);
    if(mcCache[key]!==undefined) return mcCache[key];
    var M=1500, depth=Math.min(S.length-1,16), total=0, r;
    for(r=0;r<M;r++) total+=mcValue(S,gamma,depth);
    var v=total/M; mcCache[key]=v; return v;
  }

  var sOffer=document.getElementById('sOffer');
  var sEV=document.getElementById('sEV');
  var sBig=document.getElementById('sBig');
  var sVerdict=document.getElementById('sVerdict');
  var sNote=document.getElementById('sNote');
  var sStdCoef=document.getElementById('sStdCoef');
  var sModelCoef=document.getElementById('sModelCoef');
  var sActCoef=document.getElementById('sActCoef');
  var sFloat=document.getElementById('sFloat');
  var sParse=document.getElementById('sParse');
  var sFloatWhy=document.getElementById('sFloatWhy');
  var spCoefBar=document.getElementById('spCoefBar');
  var spGauge=document.getElementById('spGauge');
  var gammaRange=document.getElementById('gammaRange');
  var gammaVal=document.getElementById('gammaVal');

  function isStruck(el){ var c=el.className; if(c&&typeof c!=='string'){ c=c.baseVal||''; } return /line-through|text-muted-foreground|decoration-danger|bg-muted/.test(c||''); }
  function gameRemaining(){
    var gone={}, v, nodes, k, li;
    nodes=qa('client/src/components/Briefcase.tsx:42');
    for(k=0;k<nodes.length;k++){ v=parseAmt(nodes[k].textContent); if(v&&PRIZES.indexOf(v)>=0) gone[v]=true; }
    for(li=0;li<LOC_MB.length;li++){ nodes=qa(LOC_MB[li]); for(k=0;k<nodes.length;k++){ v=parseAmt(nodes[k].textContent); if(v&&PRIZES.indexOf(v)>=0){ if(isStruck(nodes[k])) gone[v]=true; } } }
    var rem=[]; PRIZES.forEach(function(p){ if(!gone[p]) rem.push(p); }); return rem;
  }
  function readOffer(){ var n=q(LOC_OFFER); if(n){ var a=parseAmt(n.textContent); if(a&&a>0) return a; } return null; }
  function readEV(){
    var n=q(LOC_EV); if(n){ var sp=n.querySelector('span'); if(sp){ var a=parseAmt(sp.textContent); if(a) return a; } }
    var golds=document.querySelectorAll('span.text-gold'),i; for(i=0;i<golds.length;i++){ var a=parseAmt(golds[i].textContent); if(a) return a; }
    return null;
  }

  function sync(){
    applyLang();            // 每次刷新先按当前语言重写文案，避免静态[data-t]与动态建议语言不一致（中英混排）
    var rem=gameRemaining(); if(!rem||!rem.length){ renderSettlement(); return; }
    var offer=readOffer(); // 没有报价节点就返回 null，绝不伪造报价（开箱阶段无决策，不跑 DP）
    sOffer.textContent=offer&&offer>0?fmt(offer):'—';
    compute(rem,offer);
    renderSettlement();     // compute 之后调用：此时 offerLog 已写入，结算图才有数据
  }

  function compute(rem,offer){
    if(!rem) rem=gameRemaining(); if(!rem) return;
    var N=rem.length, gamma=parseFloat(gammaRange.value); gammaVal.textContent=gamma.toFixed(2);
    var ev=rem.reduce(function(a,b){return a+b;},0)/N;
    var bigLeft=rem.filter(function(v){return v>=100000;}).length;
    sBig.textContent=String(bigLeft);
    // 开箱阶段：无银行家报价 -> 不跑 DP，清空银行家块与标尺，等待报价
    if(!(offer>0)){
      sOffer.textContent='—';
      sEV.textContent='—';
      sVerdict.textContent=T('verdict_wait');
      sVerdict.className='sp-verdict';
      sNote.textContent=T('note_open');
      sStdCoef.textContent='—'; sModelCoef.textContent='—'; sActCoef.textContent='—'; sFloat.textContent='—';
      sParse.textContent='—'; sFloatWhy.textContent='—';
      if(spCoefBar) spCoefBar.innerHTML=''; if(spGauge) spGauge.innerHTML='';
      return;
    }
    // 银行家报价阶段：解析他的算式（用真实数填进去）+ 跑续值给出成交/不成交
    var bd=bankerBreakdown(rem,offer);
    var ce=invUtil(V(rem,gamma),gamma);
    var approx=(N>EXACT_CAP);
    var deal=offer>=ce, evDeal=offer>ev;
    // 记录每轮报价与策略（用于结算散点图）：按 round+offer 去重；轮次回退=开了新局，清空重记
    var rnd=roundFromN(N);
    var key2=rnd+'|'+Math.round(offer);
    if(key2!==lastOfferKey){ if(rnd<lastLoggedRound) offerLog=[]; offerLog.push({round:rnd,offer:offer,ce:ce,deal:deal}); lastOfferKey=key2; lastLoggedRound=rnd; }
    sOffer.textContent=fmt(offer);
    sEV.textContent=fmt(ev);
    sVerdict.textContent=deal?T('verdict_deal'):T('verdict_nodeal');
    sVerdict.className='sp-verdict '+(deal?'deal':'nodeal');
    // 银行家算式解析（展示真实数字，不展示原理推导）
    sStdCoef.textContent=pct(bd.l)+' '+T('l_round').split('{r}').join(roundFromN(N));
    sModelCoef.textContent=pct(Math.max(.08,Math.min(.98,bd.x)));
    sActCoef.textContent=pct(bd.actCoef);
    var fl=bd.actCoef-bd.l;
    sFloat.textContent=(fl>=0?'+':'')+(fl*100).toFixed(1)+'%';
    if(spCoefBar) spCoefBar.innerHTML=renderCoefBar(bd);
    if(spGauge) spGauge.innerHTML=renderGauge(bd,ce,offer);
    var parse=T('l_parse').split('{ev}').join(fmt(ev)).split('{c}').join((bd.actCoef*100).toFixed(1)).split('{o}').join(fmt(offer));
    sParse.textContent=parse+' '+T('l_check');
    var fl2=(bd.f>=0?'+':'')+(bd.f*100).toFixed(0)+'%', gl2='−'+(bd.g*100).toFixed(0)+'%', rl2=(bd.randPad>=0?'+':'')+(bd.randPad*100).toFixed(1)+'%';
    sFloatWhy.textContent=T('l_level')+' '+fl2+'（'+T('level_'+bd.fWhy)+'）｜ '+T('l_spread')+' '+gl2+'（'+T('spread_'+bd.gWhy)+'）｜ '+T('l_random')+' '+rl2;
    // 一句人话理由（结果，不是原理）
    var reason;
    if(deal){
      reason=T('reason_deal1')+fmt(offer)+T('reason_deal2')+fmt(ce)+T('reason_deal3');
      if(!evDeal) reason+=T('reason_deal_lowev')+fmt(ev)+T('reason_deal_lowev2');
    } else {
      reason=T('reason_nodeal1')+fmt(offer)+T('reason_nodeal2')+fmt(ce)+T('reason_nodeal3');
      if(bigLeft>=2) reason+=T('reason_nodeal_big')+bigLeft+T('reason_nodeal_big2');
    }
    if(approx) reason+=T('reason_approx');
    sNote.textContent=reason;
  }
  gammaRange.addEventListener('input',function(){ memo={}; mcCache={}; var rem=gameRemaining(); if(!rem) return; var offer=readOffer(); compute(rem,offer); });
  // 关键修复：MutationObserver 用 rAF 合并——一帧内多次 DOM 变动只算一次 sync()，否则 framer-motion 动画
  // 期间每帧改 class 都会触发 sync()、又重算 DP → 主线程被占满卡死。
  var raf=window.requestAnimationFrame?window.requestAnimationFrame.bind(window):function(f){return setTimeout(f,16);};
  var scheduled=false;
  function scheduleSync(){ if(scheduled) return; scheduled=true; raf(function(){ scheduled=false; try{ sync(); }catch(e){} }); }
  var obs=new MutationObserver(function(){ scheduleSync(); });
  obs.observe(document.getElementById('root'),{childList:true,subtree:true,attributes:true,attributeFilter:['class']});

  // 中英文切换：游戏切语言走 wouter 路由（file:// 退化为 hash 路由 #/zh=中文 #/=英文），按钮文案中文界面写"EN"、英文界面写"中文"。
  // 最可靠=游戏语言切换按钮文案；其次路由 /zh；最后 #root 中文采样兜底。顺序绝不能反。
  function detectLang(){
    var btns=document.querySelectorAll('button'), i, t;
    for(i=0;i<btns.length;i++){ t=(btns[i].textContent||'').trim(); if(t==='中文') return 'en'; if(t==='EN') return 'zh'; }
    var full=location.pathname+' '+location.hash;
    if(full.indexOf('/zh') >= 0) return 'zh';
    var root=document.getElementById('root');
    if(root && /[一-鿿]/.test(root.textContent||'')) return 'zh';
    return 'en';
  }
  function applyLang(){
    lang=detectLang();
    var nodes=document.querySelectorAll('[data-t]'), i, k;
    for(i=0;i<nodes.length;i++){ k=nodes[i].getAttribute('data-t'); if(I18N[lang][k]!==undefined) nodes[i].textContent=I18N[lang][k]; }
    var tg=document.getElementById('spToggle'); if(tg) tg.textContent=document.body.classList.contains('pane-hidden')?I18N[lang].toggle_show:I18N[lang].toggle_hide;
    var dt=document.querySelector('[data-dyn="detailText"]'); if(dt) dt.innerHTML=I18N[lang].detail;
  }

  applyLang();            // 先按当前语言填好文案，再首次 sync，保证动态建议字符串语言一致
  sync(); setInterval(sync,1500);

  // 右侧策略面板显隐开关（固定按钮在左侧，独立于游戏 React）
  var spToggle=document.getElementById('spToggle');
  if(spToggle){
    spToggle.addEventListener('click',function(){
      var hidden=document.body.classList.toggle('pane-hidden');
      applyLang();                  // 同步按钮文案（显示/隐藏）
      void document.body.offsetWidth;   // 强制 reflow：修复首次显示时面板未占满右侧
      if(!hidden) sync();          // 显示时立即刷新数据（且触发重绘让面板占满）
    });
  }
  // 默认隐藏右侧：不按=隐藏自己玩；按按钮=显示策略（按用户要求）
  document.body.classList.add('pane-hidden');
  applyLang();            // 按隐藏态刷新按钮文案为「显示策略面板」
  // 游戏切换语言（hash 变化）时同步切换面板语言；显示中则重算以保持动态建议语言一致
  window.addEventListener('hashchange',function(){ applyLang(); if(!document.body.classList.contains('pane-hidden')) sync(); });

  // ===== 结算浮层：未开箱揭示 + 报价散点连线图 + 决策回顾 =====
  var settleInited=false;
  function initSettlement(){
    if(settleInited) return; settleInited=true;
    var st=document.createElement('style');
    st.textContent='.sp-settle{position:fixed;top:0;right:0;width:360px;max-width:92vw;height:100vh;overflow:auto;z-index:72;'+
      'background:rgba(17,14,10,.96);border-left:1px solid rgba(227,179,65,.35);padding:14px 14px 28px;color:#e8e0d0;'+
      'font-family:Lato,system-ui,sans-serif;box-shadow:-8px 0 30px rgba(0,0,0,.5)}'+
      '.sp-settle[hidden]{display:none}'+
      '.sp-settle-title{font-family:Oswald,system-ui,sans-serif;font-size:18px;font-weight:700;color:#e3b341;margin-bottom:2px}'+
      '.sp-settle-sub{font-size:12px;color:#b8ad97;margin-bottom:12px}'+
      '.sp-settle-sec{margin-bottom:16px}'+
      '.sp-settle-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#e3b341;opacity:.85;margin-bottom:6px}'+
      '.sp-settle-list{font-size:13px;line-height:1.7;color:#f0e8d8;word-break:break-word}'+
      '.sp-settle-chart svg{display:block;background:rgba(0,0,0,.25);border-radius:6px}'+
      '.sp-legend{font-size:10px;color:#cbb89a;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}'+
      '.sp-settle-recap{font-size:12.5px;line-height:1.7;color:#e8e0d0}'+
      '.sp-settle-empty{font-size:12px;color:#9a8f79}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='spSettle'; d.className='sp-settle'; d.hidden=true;
    d.innerHTML='<div class="sp-settle-title" data-t="settle_title">结算分析</div>'+
      '<div class="sp-settle-sub" id="settleSub"></div>'+
      '<div class="sp-settle-sec"><div class="sp-settle-h" data-t="settle_unopened">未开箱金额</div><div class="sp-settle-list" id="settleUnopened"></div></div>'+
      '<div class="sp-settle-sec"><div class="sp-settle-h" data-t="settle_chart">各轮报价 vs 策略阈值</div><div class="sp-settle-chart" id="settleChart"></div></div>'+
      '<div class="sp-settle-sec"><div class="sp-settle-h" data-t="settle_recap">决策回顾</div><div class="sp-settle-recap" id="settleRecap"></div></div>';
    document.body.appendChild(d);
  }
  function readFinalWinnings(){
    var go=document.querySelector('[data-loc="client/src/components/GameOver.tsx:147"]');
    if(!go) return null;
    var m=go.textContent.match(/[$€£]?[\d,]+(?:\.\d+)?/);
    if(!m) return null;
    return parseAmt(m[0]);
  }
  function drawSettleChart(log,finalW){
    var host=document.getElementById('settleChart'); if(!host) return;
    if(!log.length){ host.innerHTML='<div class="sp-settle-empty">'+T('settle_nooffer')+'</div>'; return; }
    var W=332,H=196,padL=46,padR=12,padT=14,padB=26;
    var rounds=log.map(function(d){return d.round;}), maxR=Math.max.apply(null,rounds), minR=Math.min.apply(null,rounds);
    var allY=log.map(function(d){return d.offer;}).concat(log.map(function(d){return d.ce;})).concat([finalW||0]);
    var maxY=Math.max.apply(null,allY), minY=Math.min.apply(null,allY);
    if(maxY<=minY){ maxY=minY+1; }
    function X(r){ return padL+(r-minR)/(Math.max(1,maxR-minR))*(W-padL-padR); }
    function Y(v){ return padT+(1-(v-minY)/(maxY-minY))*(H-padT-padB); }
    var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">';
    svg+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="#7a6f57" stroke-width="1"/>';
    svg+='<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#7a6f57" stroke-width="1"/>';
    var cePts=log.map(function(d){return X(d.round)+','+Y(d.ce);}).join(' ');
    svg+='<polyline points="'+cePts+'" fill="none" stroke="#5ec8c8" stroke-width="1.5" stroke-dasharray="4 3"/>';
    var ofPts=log.map(function(d){return X(d.round)+','+Y(d.offer);}).join(' ');
    svg+='<polyline points="'+ofPts+'" fill="none" stroke="#e3b341" stroke-width="2"/>';
    log.forEach(function(d){ var c=d.deal?'#43b97f':'#d9544a'; svg+='<circle cx="'+X(d.round)+'" cy="'+Y(d.offer)+'" r="4" fill="'+c+'" stroke="#1a1410" stroke-width="1"/>'; });
    if(finalW>0){ svg+='<line x1="'+padL+'" y1="'+Y(finalW)+'" x2="'+(W-padR)+'" y2="'+Y(finalW)+'" stroke="#ffffff" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="2 2"/>'; }
    svg+='<text x="'+(padL-5)+'" y="'+(Y(maxY)+4)+'" fill="#cbb89a" font-size="9" text-anchor="end">'+fmt(maxY)+'</text>';
    svg+='<text x="'+(padL-5)+'" y="'+(H-padB)+'" fill="#cbb89a" font-size="9" text-anchor="end">'+fmt(minY)+'</text>';
    log.forEach(function(d){ svg+='<text x="'+X(d.round)+'" y="'+(H-padB+13)+'" fill="#cbb89a" font-size="9" text-anchor="middle">R'+d.round+'</text>'; });
    svg+='</svg>';
    var legend='<div class="sp-legend"><span style="color:#e3b341">● 报价</span> <span style="color:#5ec8c8">-- CE阈值</span> <span style="color:#43b97f">● 该成交</span> <span style="color:#d9544a">● 该继续</span> <span style="color:#fff">-- 最终奖金</span></div>';
    host.innerHTML=svg+legend;
  }
  function buildRecap(log,finalW){
    if(!log.length) return T('settle_nooffer');
    var last=log[log.length-1];
    var acceptedIdx=-1;
    for(var i=0;i<log.length;i++){ if(Math.abs(log[i].offer-(finalW||-1))<1){ acceptedIdx=i; break; } }
    var s='';
    if(acceptedIdx>=0){ s+=T('settle_youdeal').split('{r}').join(log[acceptedIdx].round).split('{o}').join(fmt(log[acceptedIdx].offer)); }
    else { s+=T('settle_younodeal'); }
    s+=T('settle_final').split('{w}').join(fmt(finalW||0));
    s+=T('settle_strat').split('{r}').join(last.round).split('{ce}').join(fmt(last.ce)).split('{adv}').join(last.deal?T('settle_adv_deal'):T('settle_adv_nodeal'));
    return s;
  }
  function renderSettlement(){
    initSettlement();
    var panel=document.getElementById('spSettle'); if(!panel) return;
    var go=document.querySelector('[data-loc="client/src/components/GameOver.tsx:81"]');
    if(!go){ panel.hidden=true; return; }
    panel.hidden=false;
    applyLang();
    var rem=gameRemaining()||[];
    var unopened=rem.slice().sort(function(a,b){return b-a;});
    document.getElementById('settleUnopened').textContent=unopened.length?unopened.map(fmt).join('   '):'—';
    document.getElementById('settleSub').textContent=T('settle_sub').split('{n}').join(unopened.length);
    var fw=readFinalWinnings();
    drawSettleChart(offerLog, fw);
    document.getElementById('settleRecap').textContent=buildRecap(offerLog, fw);
  }
})();

</script>
